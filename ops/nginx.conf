# Only send Connection: upgrade when the client actually asked for it. Sending it
# unconditionally breaks upstream keep-alive for ordinary requests.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# TLS terminates on the external reverse proxy and this server listens on plain
# :80, so $scheme is always "http". Forward the proxy's value instead, otherwise
# the API believes every request is insecure and never marks its admin session
# cookie Secure.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=10s;
  client_max_body_size 25m;

  # Resolve the real client address from the external proxy's X-Forwarded-For so
  # $remote_addr below is the actual caller. Only private hops are trusted as
  # proxies, so a client cannot spoof its way past this.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/javascript application/xml+rss text/css text/javascript text/plain image/svg+xml;

  # Transport and framing protections. The CSP is set by the Next.js app because it
  # needs a per-request nonce for the inline theme bootstrap script.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

  location /api/ {
    set $api_upstream api:4000;
    rewrite ^/api/?(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite rather than append: the API runs with trustProxy, so this header
    # must contain exactly one address that only this proxy can set.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location / {
    set $web_upstream web:3000;
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
