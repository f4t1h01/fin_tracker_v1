x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every service gets a memory ceiling so one runaway container cannot take the
# host (and the non-containerized production Postgres) down with it.
x-small-limits: &small-limits
  deploy:
    resources:
      limits:
        memory: 512M

services:
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api
    env_file:
      - .env
    expose:
      - "4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /health also pings the database, so "healthy" means genuinely serving.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_TELEGRAM_BOT_NAME: ${NEXT_PUBLIC_TELEGRAM_BOT_NAME}
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  bot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: bot
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: *small-limits
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      # Wait for readiness, not just container start, so the proxy does not serve
      # 502s during a deploy.
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "71:80"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    <<: *small-limits
    logging: *default-logging
